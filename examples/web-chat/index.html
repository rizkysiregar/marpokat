<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marpokat web chat (example)</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; --me: #3b82f6; --them: #8882; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header input { padding: 4px 6px; min-width: 0; }
  header .grow { flex: 1 1 220px; }
  main { flex: 1; display: flex; min-height: 0; }
  #channels { width: 260px; border-right: 1px solid var(--line); overflow: auto; }
  #channels div { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  #channels div.active { background: var(--them); }
  #channels .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: var(--me); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: #22c55e; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #title { padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #messages { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 70%; padding: 6px 10px; border-radius: 12px; background: var(--them); align-self: flex-start; word-break: break-word; position: relative; }
  .msg.mine { background: var(--me); color: #fff; align-self: flex-end; }
  .msg.system { align-self: center; background: none; color: var(--muted); font-size: 12px; }
  .msg.deleted { opacity: .6; font-style: italic; }
  .msg.pending { opacity: .55; }
  .msg small { display: block; opacity: .7; font-size: 11px; }
  .quote { border-left: 3px solid currentColor; padding-left: 6px; margin-bottom: 4px; opacity: .75; font-size: 12px; }
  .media { display: block; max-width: 100%; border-radius: 8px; margin: 4px 0; }
  .placeholder { background: #8886; border-radius: 8px; margin: 4px 0; display: flex; align-items: center; justify-content: center; font-size: 12px; max-width: 100%; }
  .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { border: 1px solid currentColor; border-radius: 10px; padding: 0 6px; font-size: 12px; cursor: pointer; background: none; color: inherit; }
  .chip.mine { background: #fff3; font-weight: 600; }
  .actions { display: none; gap: 2px; margin-top: 2px; }
  .msg:hover .actions { display: flex; }
  .actions button { background: none; border: 0; color: inherit; cursor: pointer; opacity: .8; padding: 0 3px; }
  #typing { height: 20px; padding: 0 12px; color: var(--muted); font-size: 12px; }
  #replybar, #attached { padding: 2px 12px; font-size: 12px; color: var(--muted); display: none; }
  form { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); }
  form input[type=text] { flex: 1; padding: 8px; }
  #status { font-size: 12px; color: var(--muted); }
  details { border-top: 1px solid var(--line); max-height: 30vh; overflow: auto; font: 12px/1.3 ui-monospace, monospace; }
  details summary { padding: 4px 12px; cursor: pointer; }
  #log { padding: 0 12px 8px; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 700px) { #channels { width: 120px; } }
</style>
</head>
<body>
<header>
  <input id="base" class="grow" placeholder="Marpokat URL, e.g. https://chat-api.example.com">
  <input id="key" placeholder="api key (mpk_...)" size="22">
  <input id="token" class="grow" placeholder="user token (JWT)">
  <button id="connect">Connect</button>
  <details style="border:0;max-height:none">
    <summary>Get a token from your backend</summary>
    <input id="nv" placeholder="Your backend API, e.g. https://api.example.com/api/v1" size="40">
    <input id="nvUser" placeholder="username"> <input id="nvPass" type="password" placeholder="password">
    <button id="nvGo" type="button">Sign in</button>
  </details>
  <span id="status">disconnected</span>
</header>
<main>
  <div id="channels"></div>
  <div id="chat">
    <div id="title">Pick a channel</div>
    <div id="messages"></div>
    <div id="typing"></div>
    <div id="replybar"></div>
    <div id="attached"></div>
    <form id="form">
      <button type="button" id="attach" title="Send a photo, video or file" disabled>📎</button>
      <input id="file" type="file" hidden>
      <input id="text" type="text" placeholder="Message" autocomplete="off" disabled>
      <button id="send" disabled>Send</button>
    </form>
  </div>
</main>
<details><summary>Frames</summary><div id="log"></div></details>

<script type="module">
import { Chat } from './client.js';

const $ = (id) => document.getElementById(id);
const get = (k) => { try { return localStorage.getItem('mp.' + k) || ''; } catch { return ''; } };
const set = (k, v) => { try { localStorage.setItem('mp.' + k, v); } catch { /* private window */ } };
for (const k of ['base', 'key', 'token', 'nv', 'nvUser']) $(k).value = get(k);

let chat = null;
let replyTo = null;     // the message being answered
let attached = [];      // uploads waiting to be sent: {id, name}
const QUICK = ['👍', '❤️', '😂'];

function connect() {
  for (const k of ['base', 'key', 'token']) set(k, $(k).value.trim());
  chat?.disconnect();
  chat = new Chat({
    baseUrl: $('base').value.trim(), apiKey: $('key').value.trim(),
    // an app would ask its own backend for a fresh token here; this page can only hand back what was pasted
    getToken: async () => $('token').value.trim(),
    onUpdate: render, onStatus: (s) => { $('status').textContent = s; },
    onError: (e) => { $('status').textContent = `error: ${e.code || ''} ${e.message}`; },
    log: (dir, f) => { const el = $('log'); el.textContent = `${dir} ${JSON.stringify(f)}\n` + el.textContent.slice(0, 20000); },
  });
  chat.connect();
}

const nameOf = (c) => c.name || c.dm_peer?.name || c.dm_peer?.external_id || c.id.slice(0, 8);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const size = (n) => (n > 1 << 20 ? (n / (1 << 20)).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB');

function render() { renderChannels(); renderMessages(); renderCompose(); }

function renderChannels() {
  const box = $('channels'); box.textContent = '';
  if (!chat) return;
  const list = [...chat.channels.values()].sort((a, b) => new Date(b.last_message_at || b.created_at) - new Date(a.last_message_at || a.created_at));
  for (const c of list) {
    const row = el('div', c.id === chat.current ? 'active' : '');
    row.append(el('span', 'dot' + (c.dm_peer && chat.online.get(c.dm_peer.external_id) ? ' on' : '')), el('span', 'name', nameOf(c)));
    if (c.membership.unread_count > 0) row.append(el('span', 'badge', c.membership.unread_count));
    row.onclick = () => { replyTo = null; attached = []; chat.openChannel(c.id).catch(fail); };
    box.append(row);
  }
}

function describe(m) { // system messages are worded by the client, from metadata.event
  const md = m.metadata || {}, who = (id) => id || 'someone';
  switch (md.event) {
    case 'channel.created': return `${who(md.actor_id)} created the group “${md.name}”`;
    case 'channel.renamed': return `${who(md.actor_id)} renamed the group to “${md.name}”`;
    case 'member.added': return `${who(md.actor_id)} added ${(md.user_ids || []).join(', ')}`;
    case 'member.left': return `${who(md.user_id)} left`;
    case 'member.removed': return `${who(md.actor_id)} removed ${who(md.user_id)}`;
    default: return m.text || md.event || 'system message';
  }
}

function attachment(a) {
  if (a.status === 'failed') return el('div', 'placeholder', 'this file could not be processed');
  if (a.kind === 'file') { const link = el('a', '', `${a.file_name || 'file'} (${size(a.size)})`); if (a.url) { link.href = a.url; link.download = a.file_name || ''; } return link; }
  if (!a.url) { // still being processed: keep the room the picture will take (a blurhash decoder would paint it here)
    const box = el('div', 'placeholder', 'processing…'); box.style.width = '240px'; box.style.height = (a.width && a.height ? 240 * a.height / a.width : 160) + 'px'; return box;
  }
  if (a.kind === 'video') { const v = el('video', 'media'); v.controls = true; v.src = a.url; if (a.thumbnail_url) v.poster = a.thumbnail_url; v.style.maxWidth = '320px'; return v; }
  const link = el('a'); link.href = a.url; link.target = '_blank';
  const img = el('img', 'media'); img.src = a.thumbnail_url || a.url; img.loading = 'lazy'; img.style.maxWidth = '320px'; if (a.width && a.height) { img.width = Math.min(320, a.width); img.height = Math.round(Math.min(320, a.width) * a.height / a.width); }
  link.append(img); return link;
}

function renderMessages() {
  const box = $('messages'); const ch = chat?.channels.get(chat.current);
  $('title').textContent = ch ? nameOf(ch) : 'Pick a channel';
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.textContent = '';
  if (!ch) return;
  for (const m of chat.view()) {
    const mine = m.sender?.external_id === chat.me?.external_id;
    const div = el('div', 'msg' + (mine ? ' mine' : '') + (m.type === 'system' ? ' system' : '') + (m.deleted_at ? ' deleted' : ''));
    if (m.type === 'system') { div.textContent = describe(m); box.append(div); continue; }
    if (!mine) div.append(el('small', '', m.sender?.name || m.sender?.external_id));
    if (m.deleted_at) { div.append(document.createTextNode('this message was deleted')); box.append(div); continue; }
    if (m.reply_to) div.append(el('div', 'quote', m.reply_to.deleted ? 'deleted message' : `${m.reply_to.sender_id}: ${m.reply_to.text ?? '(attachment)'}`));
    for (const a of m.attachments) div.append(attachment(a));
    if (m.text) div.append(document.createTextNode(m.text + (m.edited_at ? ' (edited)' : '')));

    const reactions = el('div', 'reactions');
    for (const [emoji, n] of Object.entries(m.reactions.counts)) {
      const on = m.reactions.mine.includes(emoji);
      const chip = el('button', 'chip' + (on ? ' mine' : ''), `${emoji} ${n}`);
      chip.onclick = () => chat.react(m.id, emoji, !on).catch(fail);
      reactions.append(chip);
    }
    if (reactions.children.length) div.append(reactions);

    const actions = el('div', 'actions');
    for (const emoji of QUICK) { const b = el('button', '', emoji); b.title = 'React'; b.onclick = () => chat.react(m.id, emoji, true).catch(fail); actions.append(b); }
    const reply = el('button', '', '↩'); reply.title = 'Reply'; reply.onclick = () => { replyTo = m; render(); $('text').focus(); }; actions.append(reply);
    if (mine) {
      const edit = el('button', '', '✎'); edit.title = 'Edit';
      edit.onclick = () => { const t = prompt('Edit message', m.text || ''); if (t && t.trim() && t !== m.text) chat.edit(m.id, t).catch(fail); };
      const del = el('button', '', '🗑'); del.title = 'Delete';
      del.onclick = () => { if (confirm('Delete this message?')) chat.remove(m.id).catch(fail); };
      actions.append(edit, del);
    }
    div.append(actions);
    box.append(div);
  }
  for (const p of chat.pending.values()) { // sent, not acknowledged yet: it stays grey until it is
    if (p.channelId !== chat.current) continue;
    box.append(el('div', 'msg mine pending', p.text || '📎'));
  }
  if (stick) box.scrollTop = box.scrollHeight;
  const names = [...chat.typing.keys()].filter((k) => k.startsWith(chat.current + ':')).map((k) => k.split(':')[1]);
  $('typing').textContent = names.length ? `${names.join(', ')} typing…` : '';
}

function renderCompose() {
  const open = !!(chat && chat.current && chat.ready);
  for (const id of ['text', 'send', 'attach']) $(id).disabled = !open;
  const rb = $('replybar'); rb.style.display = replyTo ? 'block' : 'none';
  rb.textContent = replyTo ? `Replying to ${replyTo.sender?.name || replyTo.sender?.external_id}: ${replyTo.text || '(attachment)'}  (click to cancel)` : '';
  rb.onclick = () => { replyTo = null; render(); };
  const at = $('attached'); at.style.display = attached.length ? 'block' : 'none';
  at.textContent = attached.length ? 'Attached: ' + attached.map((a) => a.name).join(', ') : '';
}

const fail = (e) => { $('status').textContent = `error: ${e.code || ''} ${e.message}`; };

$('attach').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; $('file').value = '';
  if (!f) return;
  $('status').textContent = `uploading ${f.name}…`;
  try {
    const a = await chat.upload({ type: f.type || 'application/octet-stream', size: f.size, name: f.name, data: f });
    attached.push({ id: a.id, name: f.name }); $('status').textContent = `${f.name} is ready to send`; renderCompose();
  } catch (e) { fail(e); }
};

$('form').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if ((!text && !attached.length) || !chat?.current) return;
  chat.sendMessage(chat.current, { text, attachmentIds: attached.map((a) => a.id), replyToId: replyTo?.id ?? null });
  chat.typingStop(chat.current);
  $('text').value = ''; attached = []; replyTo = null; render();
};
$('text').oninput = () => { if (chat?.current) chat.typingStart(chat.current); };

// ---------------------------------------------------------------- tenant backend helper: fills in key and token
$('nvGo').onclick = async () => {
  try {
    const nv = $('nv').value.trim().replace(/\/+$/, ''); set('nv', nv); set('nvUser', $('nvUser').value);
    const login = await (await fetch(nv + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('nvUser').value, password: $('nvPass').value }) })).json();
    const access = login.data?.token;
    const t = await (await fetch(nv + '/chat/token', { method: 'POST', headers: { Authorization: 'Bearer ' + access } })).json();
    $('base').value = t.data.baseUrl; $('key').value = t.data.apiKey; $('token').value = t.data.token;
    $('status').textContent = 'token received: press Connect';
  } catch (err) { $('status').textContent = 'Sign in to your backend failed: ' + err.message; }
};

$('connect').onclick = connect;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && chat?.current) chat.openChannel(chat.current).catch(fail); });
</script>
</body>
</html>
