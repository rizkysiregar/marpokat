version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rizkysiregar/marpokat
