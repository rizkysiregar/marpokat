# Queries are written by hand in queries/*.sql; `make gen` generates type-safe Go in internal/store.
# The schema is read straight from the goose migrations (sqlc skips the "-- +goose Down" part).
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          # jsonb as string, never []byte: with the simple protocol (required by pgbouncer, see db.Open) pgx sends
          # []byte as bytea ('\x7b...'), which jsonb rejects. A string goes as a text literal that casts to jsonb.
          - db_type: jsonb
            go_type: string
          - db_type: jsonb
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
