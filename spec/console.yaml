openapi: 3.1.0
info:
  title: Marpokat Console API
  version: 0.1.0
  description: |
    The API behind the Marpokat website (landing, sign up, project management). It is for **one client: the web
    frontend**, which holds no data of its own. Accounts, sessions, projects, keys and the audit log all live here.

    ## Not public
    It is served on its own listener (`CONSOLE_ADDR`), reachable inside the cluster only, never through the public
    ingress or Cloudflare. Every request carries the frontend's service key:

    ```
    X-Console-Key: <CONSOLE_SERVICE_KEY>
    ```

    and, once a person is signed in, their session token (`Authorization: Bearer <session token>`) from `login`.
    The frontend forwards the visitor's address in `X-Client-IP` so that limits and the audit log see the person,
    not the frontend.

    ## Accounts
    - E-mail is the identity (lower-cased, unique). Passwords are 10 to 128 characters and stored as argon2id.
    - A new account must verify its e-mail before it can create projects.
    - `register` and `forgot-password` answer the same whether or not the e-mail is known (no way to probe which
      addresses have accounts); an existing address gets a different e-mail instead.
    - A session lasts 12 hours after its last use, 30 days at most. Changing or resetting the password ends every
      other session.
    - Secrets (a project's `api_secret`) are shown **once**, when created or rotated. Rotating, setting push
      credentials and disabling a project ask for the account password again (`password` in the body).

    ## Projects
    A project is a tenant of the chat API (`spec/openapi.yaml`): its `api_key` goes into apps, its `api_secret` stays
    in the app's backend. An account can have a limited number of projects (default 3).

    ## Errors
    Same shape as the chat API: `{ "error": { "code", "message", "details?" } }`. Limits answer `429 rate_limited`
    with `Retry-After`.
servers:
  - url: http://marpokat-console.marpokat.svc.cluster.local:8081/console/v1
    description: inside the cluster
tags:
  - { name: Auth }
  - { name: Account }
  - { name: Projects }
  - { name: Platform admin, description: "Only for accounts with `is_platform_admin`" }
security:
  - serviceKey: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: 201 whether or not the e-mail is already used. A new address gets a verification e-mail (valid 24 hours), a known one a notice.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an e-mail address
      operationId: verifyEmail
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        "204": { description: Verified }
        "400": { description: "Unknown, used or expired token", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send the verification e-mail again
      description: For the signed-in account that has not verified yet. At most 3 per hour.
      operationId: resendVerification
      security: [{ serviceKey: [], session: [] }]
      responses:
        "204": { description: Sent (or already verified) }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Limited per e-mail (5 tries then 15 minutes) and per address. The same `invalid_credentials` answer for an
        unknown e-mail and a wrong password, and the same time to answer.
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: invalid_credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: The account is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End this session
      operationId: logout
      security: [{ serviceKey: [], session: [] }]
      responses:
        "204": { description: Signed out }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Ask for a password reset e-mail
      description: Always 204. A known address gets a link valid for 1 hour; asking again replaces the earlier link.
      operationId: forgotPassword
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "204": { description: Accepted }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset link
      description: Ends every session of the account.
      operationId: resetPassword
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10, maxLength: 128 } } } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Validation" }
  /me:
    get:
      tags: [Account]
      summary: The signed-in account
      operationId: getMe
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [Account]
      summary: Change the name
      operationId: updateMe
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /me/password:
    put:
      tags: [Account]
      summary: Change the password
      description: Ends every other session.
      operationId: changePassword
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 10, maxLength: 128 } } } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/WrongPassword" }
  /me/sessions:
    get:
      tags: [Account]
      summary: Where the account is signed in
      operationId: listSessions
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { sessions: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } } } } }
  /me/audit:
    get:
      tags: [Account]
      summary: Recent security events of the account (sign-ins, key rotations, ...)
      operationId: listAudit
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } } }
  /projects:
    get:
      tags: [Projects]
      summary: The account's projects
      operationId: listProjects
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: "#/components/schemas/Project" } } } } } } }
    post:
      tags: [Projects]
      summary: Create a project
      description: Needs a verified e-mail. The answer carries the `api_secret`, shown only now.
      operationId: createProject
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: "Chosen from the name when left out; a number is added when taken." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectWithSecret" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { description: "`email_not_verified` or `project_limit_reached`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The slug is taken, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /projects/{project_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      summary: One project, with its usage
      operationId: getProject
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Rename, or change what clients may do
      operationId: updateProject
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                client_can_create_dm: { type: boolean }
                client_can_create_group: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/rotate-secret:
    post:
      tags: [Projects]
      summary: Replace the api secret
      description: The old secret stops working within 30 seconds. The new one is shown only in this answer.
      operationId: rotateSecret
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordConfirmation" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { api_secret: { type: string } } } } } }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/push:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    put:
      tags: [Projects]
      summary: Set the Firebase service account used for push notifications
      description: Stored encrypted and never returned; `GET` shows only which project and account it is.
      operationId: setPush
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_account, password]
              properties:
                service_account: { type: string, description: "The JSON key file of a Firebase service account, as text." }
                password: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushStatus" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Projects]
      summary: Whether push is set up
      operationId: getPush
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushStatus" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      summary: Remove the push credentials
      operationId: removePush
      security: [{ serviceKey: [], session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordConfirmation" } } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/disable:
    post:
      tags: [Projects]
      summary: Switch a project off (or on again)
      description: A disabled project's apps get 401 within 30 seconds.
      operationId: setProjectDisabled
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled, password]
              properties: { disabled: { type: boolean }, password: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/accounts:
    get:
      tags: [Platform admin]
      summary: All accounts
      operationId: adminListAccounts
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }, next_cursor: { type: [string, "null"] } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounts/{account_id}/disable:
    post:
      tags: [Platform admin]
      summary: Disable or enable an account
      description: A disabled account cannot sign in and its sessions end. Its projects keep running unless disabled themselves.
      operationId: adminSetAccountDisabled
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/projects:
    get:
      tags: [Platform admin]
      summary: All projects
      operationId: adminListProjects
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: "#/components/schemas/AdminProject" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/projects/{project_id}/disable:
    post:
      tags: [Platform admin]
      summary: Disable or enable any project
      operationId: adminSetProjectDisabled
      security: [{ serviceKey: [], session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProject" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/stats:
    get:
      tags: [Platform admin]
      summary: Totals across the platform
      operationId: adminStats
      security: [{ serviceKey: [], session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: integer }
                  projects: { type: integer }
                  active_projects: { type: integer }
                  users: { type: integer }
                  channels: { type: integer }
                  messages: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    serviceKey: { type: apiKey, in: header, name: X-Console-Key }
    session: { type: http, scheme: bearer }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Validation: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthenticated: { description: No valid session (`unauthenticated`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Not allowed (`forbidden`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: "Not found, also for a project of another account", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    WrongPassword: { description: The password does not match (`wrong_password`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`rate_limited`), headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: { type: object, additionalProperties: true } }
    PasswordConfirmation:
      type: object
      required: [password]
      properties: { password: { type: string } }
    Account:
      type: object
      required: [id, email, name, email_verified, is_platform_admin, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        is_platform_admin: { type: boolean }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [token, expires_at, account]
      properties:
        token: { type: string, description: "Opaque. Keep it server side (the frontend's own session) and send it as the bearer token." }
        expires_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    SessionInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        user_agent: { type: string }
        ip: { type: string }
    AuditEvent:
      type: object
      properties:
        action: { type: string, examples: [login, password_changed, project_created, secret_rotated, push_set] }
        target: { type: [string, "null"] }
        ip: { type: string }
        at: { type: string, format: date-time }
    Project:
      type: object
      required: [id, slug, name, api_key, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        api_key: { type: string, description: "Public: goes into apps." }
        client_can_create_dm: { type: boolean }
        client_can_create_group: { type: boolean }
        push_configured: { type: boolean }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    ProjectWithSecret:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [api_secret]
          properties:
            api_secret: { type: string, description: "Shown once. Keep it in the app's backend, never in an app." }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            usage:
              type: object
              properties:
                users: { type: integer }
                channels: { type: integer }
                messages: { type: integer, format: int64 }
    PushStatus:
      type: object
      properties:
        configured: { type: boolean }
        firebase_project_id: { type: string }
        client_email: { type: string }
    AdminProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            owner_email: { type: [string, "null"] }
