openapi: 3.1.0
info:
  title: Marpokat Console API
  version: 0.3.0
  description: |
    The API behind the Marpokat website: the **portal** (landing, docs, sign up, project management) and the **admin**
    app (internal). Both are static apps that hold no data and no logic of their own: they call this API from the
    browser. Accounts, sessions, projects, keys and the audit log all live here.

    ## Where it is
    On its own listener (`CONSOLE_ADDR`). The ingress of each web host sends `/console/v1` here and everything else to
    the app's files, so the API is always on the **same origin** as the app that calls it: no CORS.

    ## Sessions and requests (browser only)
    - `login` sets the session cookie `__Host-mp_session` (`HttpOnly`, `Secure`, `SameSite=Strict`, `Path=/`). The
      token is never in a response body: no script on the page can read it. `logout` clears it, and so does any answer
      `401` to a request that carried an ended session.
    - Every request that is not `GET`/`HEAD` must carry an `Origin` of the portal or the admin app
      (`403 origin_not_allowed` otherwise) and, when it has a body, `Content-Type: application/json`
      (`415 unsupported_media_type` otherwise). Browsers do both on their own for `fetch` with a JSON body.
    - A sign in on the admin app's origin gives an **admin session** and is only for platform administrators. The
      `/admin/*` endpoints need an admin session; a portal session of an administrator gets `403`.
    - Sign up and password reset carry a Cloudflare Turnstile token (`turnstile_token`) when the server has the check
      turned on: `400 captcha_failed` when it does not pass, `503 captcha_unavailable` when Cloudflare cannot be
      reached (the check fails closed).
    - The visitor's address (limits, audit) is `CF-Connecting-IP` as the ingress passes it on; the header is ignored
      on connections that do not come from a trusted proxy.
    - Every answer is `Cache-Control: no-store`.

    ## Accounts
    - E-mail is the identity (lower-cased, unique). Passwords are 10 to 128 characters and stored as argon2id.
    - A new account must verify its e-mail before it can create projects.
    - `register` and `forgot-password` answer the same whether or not the e-mail is known (no way to probe which
      addresses have accounts); an existing address gets a different e-mail instead.
    - A session lasts 12 hours after its last use, 30 days at most. Changing or resetting the password ends every
      other session.
    - Secrets (a project's `api_secret`) are shown **once**, when created or rotated. Rotating, setting push
      credentials and disabling a project ask for the account password again (`password` in the body).

    ## Projects
    A project is a tenant of the chat API (`spec/openapi.yaml`): its `api_key` goes into apps, its `api_secret` stays
    in the app's backend. An account can have a limited number of projects (default 3).

    Deleting a project (PLAN D75) switches it off at once and schedules it: `delete_after` says when the worker removes
    it with all its users, conversations, messages and files (3 days by default). Until then it can be restored (it
    stays off until switched on) and it does not count against the limit; it cannot be switched on while scheduled.

    ## Errors
    Same shape as the chat API: `{ "error": { "code", "message", "details?" } }`. Limits answer `429 rate_limited`
    with `Retry-After`.
servers:
  - url: /console/v1
    description: On the host of the portal or the admin app (the ingress routes this path to the Console API)
tags:
  - { name: Auth }
  - { name: Account }
  - { name: Projects }
  - { name: Platform admin, description: "Only for accounts with `is_platform_admin`" }
security: []
paths:
  /status:
    get:
      tags: [Auth]
      summary: What the sign up page should offer
      operationId: status
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [registration_open], properties: { registration_open: { type: boolean } } } } } }
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: 201 whether or not the e-mail is already used. A new address gets a verification e-mail (valid 24 hours), a known one a notice.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                name: { type: string, minLength: 1, maxLength: 100 }
                turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        "400": { description: "Validation failed, or `captcha_failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "Sign up is closed for now (`registration_closed`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an e-mail address
      operationId: verifyEmail
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        "204": { description: Verified }
        "400": { description: "Unknown, used or expired token", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send the verification e-mail again
      description: For the signed-in account that has not verified yet. At most 3 per hour.
      operationId: resendVerification
      security: [{ session: [] }]
      responses:
        "204": { description: Sent (or already verified) }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Limited per e-mail (5 tries then 15 minutes) and per address. The same `invalid_credentials` answer for an
        unknown e-mail and a wrong password, and the same time to answer. Sets the session cookie. From the admin app's
        origin it starts an admin session, and an account that is not a platform administrator gets `403 forbidden`.
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { description: "`__Host-mp_session=...; Path=/; Max-Age=...; HttpOnly; Secure; SameSite=Strict`", schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "401": { description: invalid_credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "The account is disabled (`account_disabled`), or not an administrator signing in on the admin app (`forbidden`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End this session
      description: Clears the session cookie.
      operationId: logout
      security: [{ session: [] }]
      responses:
        "204": { description: Signed out }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Ask for a password reset e-mail
      description: Always 204. A known address gets a link valid for 1 hour; asking again replaces the earlier link.
      operationId: forgotPassword
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, turnstile_token: { $ref: "#/components/schemas/TurnstileToken" } } } } }
      responses:
        "204": { description: Accepted }
        "400": { description: "`captcha_failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset link
      description: Ends every session of the account.
      operationId: resetPassword
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10, maxLength: 128 } } } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Validation" }
  /me:
    get:
      tags: [Account]
      summary: The signed-in account
      operationId: getMe
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [Account]
      summary: Change the name
      operationId: updateMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /me/password:
    put:
      tags: [Account]
      summary: Change the password
      description: Ends every other session.
      operationId: changePassword
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 10, maxLength: 128 } } } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/WrongPassword" }
  /me/sessions:
    get:
      tags: [Account]
      summary: Where the account is signed in
      operationId: listSessions
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { sessions: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } } } } }
  /me/sessions/{session_id}:
    delete:
      tags: [Account]
      summary: Sign out one session of the account
      description: Ending the current session is a sign out (the cookie is cleared). A session of another account is 404.
      operationId: endSession
      security: [{ session: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Ended }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/audit:
    get:
      tags: [Account]
      summary: Recent security events of the account (sign-ins, key rotations, ...)
      operationId: listAudit
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } } }
  /projects:
    get:
      tags: [Projects]
      summary: The account's projects
      operationId: listProjects
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: "#/components/schemas/Project" } } } } } } }
    post:
      tags: [Projects]
      summary: Create a project
      description: Needs a verified e-mail. The answer carries the `api_secret`, shown only now.
      operationId: createProject
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: "Chosen from the name when left out; a number is added when taken." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectWithSecret" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { description: "`email_not_verified` or `project_limit_reached`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The slug is taken, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /projects/{project_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      summary: One project, with its usage
      operationId: getProject
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Rename, or change what clients may do
      operationId: updateProject
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                client_can_create_dm: { type: boolean }
                client_can_create_group: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      summary: Delete the project, after a grace period
      description: Switches it off now and sets `delete_after`. Asks the password. Asking again changes nothing.
      operationId: deleteProject
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordConfirmation" } } }
      responses:
        "202": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/restore:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Projects]
      summary: Cancel a scheduled deletion
      description: The project stays switched off.
      operationId: restoreProject
      security: [{ session: [] }]
      responses:
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/rotate-secret:
    post:
      tags: [Projects]
      summary: Replace the api secret
      description: The old secret stops working within 30 seconds. The new one is shown only in this answer.
      operationId: rotateSecret
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordConfirmation" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { api_secret: { type: string } } } } } }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/push:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    put:
      tags: [Projects]
      summary: Set the Firebase service account used for push notifications
      description: Stored encrypted and never returned; `GET` shows only which project and account it is.
      operationId: setPush
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_account, password]
              properties:
                service_account: { type: string, description: "The JSON key file of a Firebase service account, as text." }
                password: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushStatus" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Projects]
      summary: Whether push is set up
      operationId: getPush
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushStatus" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      summary: Remove the push credentials
      operationId: removePush
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordConfirmation" } } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{project_id}/disable:
    post:
      tags: [Projects]
      summary: Switch a project off (or on again)
      description: A disabled project's apps get 401 within 30 seconds.
      operationId: setProjectDisabled
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled, password]
              properties: { disabled: { type: boolean }, password: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/WrongPassword" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/accounts:
    get:
      tags: [Platform admin]
      summary: All accounts
      operationId: adminListAccounts
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, description: "Only accounts whose e-mail or name contains this", schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }, next_cursor: { type: [string, "null"] } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounts/{account_id}:
    get:
      tags: [Platform admin]
      summary: One account, its projects, sessions and recent security events
      operationId: adminGetAccount
      security: [{ session: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
                  sessions: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } }
                  events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/accounts/{account_id}/sign-out:
    post:
      tags: [Platform admin]
      summary: End every session of an account, without disabling it
      operationId: adminSignOutAccount
      security: [{ session: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "400": { description: Not your own account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/accounts/{account_id}/disable:
    post:
      tags: [Platform admin]
      summary: Disable or enable an account
      description: A disabled account cannot sign in and its sessions end. Its projects keep running unless disabled themselves.
      operationId: adminSetAccountDisabled
      security: [{ session: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/projects:
    get:
      tags: [Platform admin]
      summary: All projects
      operationId: adminListProjects
      security: [{ session: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: "#/components/schemas/AdminProject" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/projects/{project_id}/disable:
    post:
      tags: [Platform admin]
      summary: Disable or enable any project
      operationId: adminSetProjectDisabled
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProject" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/stats:
    get:
      tags: [Platform admin]
      summary: Totals across the platform
      operationId: adminStats
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: integer }
                  projects: { type: integer }
                  active_projects: { type: integer }
                  users: { type: integer }
                  channels: { type: integer }
                  messages: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/stats/series:
    get:
      tags: [Platform admin]
      summary: Per day (UTC) over a period, and the busiest projects of it
      description: New accounts, new projects, messages sent and people who sent one (system messages are not counted).
      operationId: adminStatsSeries
      security: [{ session: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Oldest day first, today last
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        accounts: { type: integer }
                        projects: { type: integer }
                        messages: { type: integer, format: int64 }
                        active_users: { type: integer }
                  top_projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        messages: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/projects/{project_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Platform admin]
      summary: One project with its owner, usage and push status
      operationId: adminGetProject
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/AdminProject" }
                  owner_id: { type: [string, "null"], format: uuid }
                  usage: { type: object, properties: { users: { type: integer }, channels: { type: integer }, messages: { type: integer, format: int64 } } }
                  push: { $ref: "#/components/schemas/PushStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit:
    get:
      tags: [Platform admin]
      summary: The security events of every account, newest first
      operationId: adminAudit
      security: [{ session: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, description: The `next_cursor` of the previous page, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }, next_cursor: { type: [string, "null"] } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-mp_session, description: "Set by `login`; the browser sends it." }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Validation: { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthenticated: { description: No valid session (`unauthenticated`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: "Not allowed (`forbidden`): not a platform administrator, or not an admin session", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: "Not found, also for a project of another account", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    WrongPassword: { description: The password does not match (`wrong_password`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    CaptchaUnavailable: { description: Cloudflare could not be reached to check the Turnstile token (`captcha_unavailable`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`rate_limited`), headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: { type: object, additionalProperties: true } }
    PasswordConfirmation:
      type: object
      required: [password]
      properties: { password: { type: string } }
    Account:
      type: object
      required: [id, email, name, email_verified, is_platform_admin, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        is_platform_admin: { type: boolean }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    TurnstileToken:
      type: string
      maxLength: 2048
      description: The token the Turnstile widget gave the page. Required when the server has the check turned on.
    Session:
      type: object
      required: [expires_at, scope, account]
      properties:
        expires_at: { type: string, format: date-time, description: "When the session ends if it is not used (it is extended on use, 30 days at most)." }
        scope: { type: string, enum: [portal, admin] }
        account: { $ref: "#/components/schemas/Account" }
    SessionInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        user_agent: { type: string }
        ip: { type: string }
        scope: { type: string, enum: [portal, admin] }
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid, description: "Only in the platform audit log" }
        account_email: { type: string, description: "Only in the platform audit log" }
        action: { type: string, examples: [login, admin_login, password_changed, project_created, secret_rotated, push_set] }
        target: { type: [string, "null"] }
        ip: { type: string }
        at: { type: string, format: date-time }
    Project:
      type: object
      required: [id, slug, name, api_key, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        api_key: { type: string, description: "Public: goes into apps." }
        client_can_create_dm: { type: boolean }
        client_can_create_group: { type: boolean }
        push_configured: { type: boolean }
        disabled: { type: boolean }
        delete_after: { type: [string, "null"], format: date-time, description: "When a deleted project is removed for good; null when it is not being deleted" }
        created_at: { type: string, format: date-time }
    ProjectWithSecret:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [api_secret]
          properties:
            api_secret: { type: string, description: "Shown once. Keep it in the app's backend, never in an app." }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            usage:
              type: object
              properties:
                users: { type: integer }
                channels: { type: integer }
                messages: { type: integer, format: int64 }
    PushStatus:
      type: object
      properties:
        configured: { type: boolean }
        firebase_project_id: { type: string }
        client_email: { type: string }
    AdminProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            owner_email: { type: [string, "null"] }
